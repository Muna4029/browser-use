name: test

on: push

jobs:
  tests:
    name: ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        test:
          # TODO:
          # - browser/patchright
          # - browser/user_binary
          # - browser/remote_cdp
          # - models/openai
          # - models/google
          # - models/anthropic
          # - models/azure
          # - models/deepseek
          # - models/grok
          # - functionality/click
          # - functionality/tabs
          # - functionality/input
          # - functionality/scroll
          # - functionality/upload
          # - functionality/download
          # - functionality/save
          # - functionality/vision
          # - functionality/memory
          # - functionality/planner
          # - functionality/hooks
          - test_controller
          - test_tab_management
          - test_sensitive_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true

      - name: Report environment
        run: |
          uv --version
          uv run python --version
          uname -a

      - name: Detect Patchright version
        shell: bash
        run: |
          echo "PLAYWRIGHT_VERSION=$(grep -oP 'patchright>=\K[0-9.]+' pyproject.toml)" >> "$GITHUB_ENV"

      - name: Cache Playwright binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Chromium and dependencies
        run: |
          uv run patchright install --no-shell --with-deps chromium

      - name: Report installed browser dependencies
        run: |
          uv run python -c "import importlib.metadata as m; print('patchright:', m.version('patchright'))"
          uv run python -c "import importlib.metadata as m; print('pytest:', m.version('pytest'))"
          uv run python -c "import importlib.metadata as m; print('pytest-asyncio:', m.version('pytest-asyncio'))"

      - name: Run tests
        timeout-minutes: 90
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          uv run \
            --with=dotenv \
            --with=pytest-timeout \
            pytest \
            -vv \
            -s \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --junitxml=pytest-results.xml \
            tests/${{ matrix.test }}.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.test }}
          path: pytest-results.xml
          if-no-files-found: ignore
